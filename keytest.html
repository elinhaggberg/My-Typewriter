<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Tangenttest</title>
  <style>
    :root {
      --desk: #f3ead6;
      --surface: #fffcf4;
      --text: #29221c;
      --dim: #857a68;
      --accent: #467566;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: calc(env(safe-area-inset-top) + 16px) 16px 32px;
      background: var(--desk);
      color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0; font: 600 26px/1.2 ui-serif, Georgia, serif; }
    p { margin: 0; }
    .card { background: var(--surface); border-radius: 18px; padding: 16px; box-shadow: 0 2px 10px rgba(41, 34, 28, .08); }
    ol { margin: 0; padding-left: 22px; }
    textarea {
      width: 100%;
      min-height: 84px;
      padding: 12px;
      border: 2px solid #e3d7b8;
      border-radius: 14px;
      background: #fff;
      font: 22px/1.3 -apple-system, sans-serif;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      appearance: none;
      border: 0;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font: 600 15px/1 -apple-system, sans-serif;
      cursor: pointer;
    }
    button.secondary { background: #e9dec4; color: var(--text); }
    #log { display: flex; flex-direction: column; gap: 6px; font: 13px/1.4 ui-monospace, Menlo, monospace; }
    .ev { padding: 8px 10px; border-radius: 10px; background: #f6efe0; word-break: break-word; }
    .ev b { color: var(--accent); }
    .ev.emoji { background: #fde9c8; }
    .status { font-size: 14px; color: var(--dim); }
  </style>
</head>
<body>
  <main>
    <h1>Tangenttest</h1>
    <div class="card">
      <ol>
        <li>Koppla in tangentbordet.</li>
        <li>Tryck i den vita rutan nedan, och sen på emoji-tangenterna, en i taget.</li>
        <li>Tryck sen <b>utanför</b> rutan (så den inte är vald) och tryck på emoji-tangenterna igen.</li>
        <li>Tryck på <b>Kopiera loggen</b> och klistra in den i chatten.</li>
      </ol>
    </div>
    <textarea id="field" placeholder="Tryck här först…" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <div class="row">
      <button id="copy">Kopiera loggen</button>
      <button id="clear" class="secondary">Rensa</button>
    </div>
    <p class="status" id="status"></p>
    <div id="log"></div>
  </main>

  <script>
    // Logs everything a keyboard sends: key events, text input and composition,
    // both with the text field focused and without. Nothing leaves the device.
    const field = document.getElementById("field");
    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const lines = [];

    const codepoints = (s) =>
      s ? [...s].map((c) => "U+" + c.codePointAt(0).toString(16).toUpperCase().padStart(4, "0")).join(" ") : "";
    const isEmoji = (s) => /\p{Extended_Pictographic}/u.test(s || "");

    function add(kind, parts, emoji) {
      const where = document.activeElement === field ? "i rutan" : "utanför";
      const text = `${kind} (${where}): ${parts.filter(Boolean).join(" | ")}`;
      lines.push(text);
      const el = document.createElement("div");
      el.className = "ev" + (emoji ? " emoji" : "");
      el.innerHTML = `<b>${kind}</b> <span></span>`;
      el.querySelector("span").textContent = `(${where}) ` + parts.filter(Boolean).join(" | ");
      logEl.prepend(el);
      statusEl.textContent = `${lines.length} händelser`;
    }

    function keyEvent(e) {
      if (e.type === "keyup" && !isEmoji(e.key) && e.key.length === 1) return; // keep the log short
      const mods = ["Shift", "Control", "Alt", "Meta"].filter((m) => e.getModifierState(m)).join("+");
      add(e.type, [
        `key="${e.key}"`,
        e.key.length <= 4 ? codepoints(e.key) : "", // characters, not named keys like "Enter"
        `code=${e.code || "-"}`,
        `keyCode=${e.keyCode}`,
        mods && `mods=${mods}`,
        e.repeat && "repeat",
        e.isComposing && "composing",
      ], isEmoji(e.key));
    }

    function inputEvent(e) {
      add(e.type, [
        e.inputType && `inputType=${e.inputType}`,
        e.data != null && `data="${e.data}"`,
        e.data && codepoints(e.data),
      ], isEmoji(e.data));
    }

    for (const t of ["keydown", "keyup"]) window.addEventListener(t, keyEvent, true);
    for (const t of ["beforeinput", "input", "compositionstart", "compositionupdate", "compositionend"]) {
      field.addEventListener(t, inputEvent);
    }
    window.addEventListener("paste", (e) => add("paste", [`"${e.clipboardData?.getData("text") || ""}"`]));

    add("start", [navigator.userAgent]);

    document.getElementById("clear").addEventListener("click", () => {
      lines.length = 0;
      logEl.innerHTML = "";
      field.value = "";
      add("start", [navigator.userAgent]);
    });

    document.getElementById("copy").addEventListener("click", async () => {
      const text = lines.join("\n");
      try {
        await navigator.clipboard.writeText(text);
        statusEl.textContent = "Kopierat! Klistra in det i chatten.";
      } catch {
        // Fallback: put it in the field so it can be selected and copied by hand.
        field.value = text;
        field.focus();
        field.select();
        statusEl.textContent = "Markera texten i rutan och kopiera den.";
      }
    });
  </script>
</body>
</html>
