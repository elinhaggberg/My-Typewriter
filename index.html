<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f3ead6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Typewriter">
  <meta name="description" content="A little typewriter for small writers. Works offline, saves locally.">
  <title>My Typewriter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/special-elite-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="toolbar">
      <button class="tool" id="btn-folder" aria-label="Öppna mappen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.6l2 2h7.4A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="currentColor" opacity=".18"/><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.6l2 2h7.4A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="label">Mappen</span>
        <span class="badge" id="folder-count" hidden></span>
      </button>
      <div class="spacer"></div>
      <button class="tool" id="btn-preview" aria-label="Titta på papperet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="currentColor" opacity=".18"/><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>
        <span class="label">Titta</span>
      </button>
      <button class="tool" id="btn-play" aria-label="Lekläge" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20L15 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M16.5 2.5l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1zM8 3l.6 1.4L10 5l-1.4.6L8 7l-.6-1.4L6 5l1.4-.6zM20 12l.6 1.4 1.4.6-1.4.6L20 16l-.6-1.4L18 14l1.4-.6z" fill="currentColor"/></svg>
        <span class="label">Lek</span>
      </button>
      <button class="tool" id="btn-stamps" aria-label="Stämplar" aria-haspopup="dialog" aria-expanded="false">
        <svg class="stamp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3.5h5a1.5 1.5 0 0 1 1.5 1.5v2a3 3 0 0 1-1.5 2.6V12h3A2.5 2.5 0 0 1 20 14.5V16H4v-1.5A2.5 2.5 0 0 1 6.5 12h3V9.6A3 3 0 0 1 8 7V5a1.5 1.5 0 0 1 1.5-1.5z" fill="currentColor" opacity=".18"/><path d="M9.5 3.5h5a1.5 1.5 0 0 1 1.5 1.5v2a3 3 0 0 1-1.5 2.6V12h3A2.5 2.5 0 0 1 20 14.5V16H4v-1.5A2.5 2.5 0 0 1 6.5 12h3V9.6A3 3 0 0 1 8 7V5a1.5 1.5 0 0 1 1.5-1.5zM5 19.5h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <span class="chosen" aria-hidden="true"></span>
        <span class="label">Stämpla</span>
      </button>
      <button class="tool icon-only" id="btn-sound" aria-label="Ljud på eller av" aria-pressed="true">
        <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="tool icon-only settings-btn" id="btn-settings" aria-label="Inställningar" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5l1.6 1.2-2 3.4-1.9-.7a7.5 7.5 0 0 1-2 1.2L14.8 21h-4l-.3-2.4a7.5 7.5 0 0 1-2-1.2l-1.9.7-2-3.4 1.6-1.2a7.6 7.6 0 0 1 0-2.4L4.6 9.9l2-3.4 1.9.7a7.5 7.5 0 0 1 2-1.2L10.8 3h4l.3 2.4a7.5 7.5 0 0 1 2 1.2l1.9-.7 2 3.4-1.6 1.2a7.6 7.6 0 0 1 0 2.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="tool" id="btn-trash" aria-label="Släng papperet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13l-1.2 11.2a2 2 0 0 1-2 1.8H8.7a2 2 0 0 1-2-1.8z" fill="currentColor" opacity=".18"/><path d="M5.5 8h13l-1.2 11.2a2 2 0 0 1-2 1.8H8.7a2 2 0 0 1-2-1.8zM4 5.5h16M9.5 5.5V4h5v1.5M10 11.5v6M14 11.5v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="label">Släng</span>
      </button>
      <button class="tool primary" id="btn-save" aria-label="Spara papperet i mappen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="label">Spara</span>
      </button>
    </header>
    <div class="play-menu" id="play-menu" role="menu" aria-label="Lekläge" hidden></div>
    <div class="stamp-drawer" id="stamp-drawer" role="dialog" aria-label="Stämplar" hidden></div>

    <button class="side-tab settings-btn" id="side-settings" aria-label="Inställningar" aria-haspopup="dialog" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5l1.6 1.2-2 3.4-1.9-.7a7.5 7.5 0 0 1-2 1.2L14.8 21h-4l-.3-2.4a7.5 7.5 0 0 1-2-1.2l-1.9.7-2-3.4 1.6-1.2a7.6 7.6 0 0 1 0-2.4L4.6 9.9l2-3.4 1.9.7a7.5 7.5 0 0 1 2-1.2L10.8 3h4l.3 2.4a7.5 7.5 0 0 1 2 1.2l1.9-.7 2 3.4-1.6 1.2a7.6 7.6 0 0 1 0 2.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
    <main class="stage" id="stage">
      <div class="page-tag" id="page-tag" hidden></div>
      <div class="levels" id="levels" role="group" aria-label="Nivå" hidden></div>
      <div class="paper-rest" aria-hidden="true"></div>
      <div class="carriage" id="carriage">
        <div class="paper" id="paper"></div>
        <div class="roller"><span class="knob left"></span><span class="knob right"></span></div>
        <button class="lever" id="lever" aria-label="Ny rad"><span class="rod"></span><span class="ball"></span></button>
      </div>
      <div class="typeguide" id="typeguide" aria-hidden="true"><span class="ribbon"></span></div>
    </main>

    <section class="machine" id="machine">
      <button class="nameplate" id="nameplate" aria-label="Inställningar för maskinen" aria-haspopup="dialog" aria-expanded="false">My Typewriter</button>
      <div class="keyboard" id="keyboard" aria-label="Tangentbord"></div>
      <button type="button" class="kb-handle" id="kb-handle" aria-label="Visa tangentbordet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 10h.01M9 10h.01M12 10h.01M15 10h.01M18 10h.01M8 14h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Visa tangentbordet</span>
      </button>
    </section>
  </div>

  <div class="settings" id="settings" role="dialog" aria-label="Maskinen" hidden>
    <label class="set-row">
      <span class="set-label">Maskinens namn</span>
      <input type="text" id="set-name" maxlength="22" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="My Typewriter">
    </label>
    <div class="set-row">
      <span class="set-label">Färg</span>
      <div class="swatches" id="set-colors"></div>
    </div>
    <div class="set-row">
      <span class="set-label">Papper</span>
      <div class="paper-picks" id="set-papers"></div>
    </div>
    <div class="set-row toggles">
      <button type="button" class="toggle" id="set-keyboard" aria-pressed="true">Tangentbord på skärmen</button>
    </div>
  </div>

  <section class="sheet" id="folder" role="dialog" aria-modal="true" aria-label="Mappen" hidden>
    <header class="sheet-head">
      <button class="tool icon-only" id="folder-close" aria-label="Stäng mappen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="saved" aria-selected="true">Sparade <span class="count" id="count-saved"></span></button>
        <button role="tab" data-tab="trash" aria-selected="false">Papperskorgen <span class="count" id="count-trash"></span></button>
      </div>
      <div class="spacer"></div>
    </header>
    <div class="sheet-body" id="folder-body"></div>
  </section>

  <section class="sheet detail" id="detail" role="dialog" aria-modal="true" aria-label="Papper" hidden>
    <header class="sheet-head">
      <button class="tool" id="detail-back" aria-label="Tillbaka till mappen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="label">Mappen</span>
      </button>
      <div class="detail-title" id="detail-title"></div>
    </header>
    <div class="actions" id="detail-actions"></div>
    <div class="sheet-body pages" id="detail-pages"></div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
